# =====================================================================
#  DeckWatch — CONFIGURAZIONE (config.toml)
#  Percorso sulla Deck: ~/.config/deckwatch/config.toml
#  Dopo una modifica:  systemctl --user restart deckwatch
#  Prova invio messaggi:  deckwatch test
# =====================================================================

# I report partono a fine giornata: alla prima accensione del giorno dopo
# (o a mezzanotte se la Deck è accesa). Il riepilogo settimanale (sabato→venerdì)
# parte dal sabato. Durante il giorno: /oggi su Telegram.

# Aggiornamenti automatici (controllo una volta al giorno).
update_url = "https://raw.githubusercontent.com/mbagattini/deckwatch/main"
auto_update = true

[telegram]
# Token del bot, ottenuto da @BotFather su Telegram.
token = ""
# Chat id dei genitori: ognuno apre il bot e preme Avvia, poi
#   deckwatch telegram-setup --save
parents = []
# (facoltativo) chat id del figlio, se usa Telegram: riceve il suo report.
kid = []

[email]
# Invio tramite Brevo (brevo.com, piano gratuito). Dati in Brevo:
#   Impostazioni → SMTP & API → scheda SMTP
# La chiave SMTP permette solo di inviare: non dà accesso a nessuna casella.
smtp_host = "smtp-relay.brevo.com"
smtp_port = 587
username = ""        # "Login" SMTP mostrato da Brevo (es. 1a2b3c001@smtp-brevo.com)
password = ""        # chiave SMTP (non la chiave API)
sender = ""          # mittente VERIFICATO in Brevo, es. "DeckWatch <tuo.indirizzo@gmail.com>"
kid = []             # es. ["figlio@gmail.com"]
parents = []         # facoltativo: usato solo se Telegram non è configurato
